# Security notes. This stack is a local development tool and makes these tradeoffs on purpose:
#
# - seccomp:unconfined and SYS_PTRACE: Chromium under Docker's default seccomp profile
#   crashes or cannot start its crash handler, so these follow the common practice for
#   Chromium-in-Docker images. The golden browser also runs with --no-sandbox, so the
#   container, not Chromium's sandbox, is the isolation boundary. Only browse sites you
#   would trust with that.
# - noVNC, both MCP servers and the golden browser's DevTools port listen on 0.0.0.0
#   inside the container. That is acceptable because the host publishes noVNC and MCP on
#   127.0.0.1 only (see `ports`) and does not publish DevTools, so nothing on the LAN can
#   reach them. On the host, the MCP servers accept only localhost Host headers (blocking
#   DNS rebinding from web pages) and noVNC requires a password (see entrypoint.sh).
#   Other containers on playwright-network can still reach DevTools.
# - no-new-privileges: processes cannot gain privileges through setuid binaries.
# - The upstream Dockerfile builds FROM mcp/playwright:latest. additional_contexts below
#   pins that to a digest, so a rebuild cannot silently pick up a new base image.
# - Both browsers run a pinned Chrome for Testing build (chrome/Dockerfile), not the one
#   Playwright bundles. Chrome for Testing never updates itself, but Chrome still downloads
#   its certificate revocation list (CRLSet) in the background. Playwright turns that off by
#   default; playwright-config.json turns it back on so isolated sessions receive emergency
#   certificate blocks too. A fresh isolated session has no list until the first download.
# - `golden export` writes the golden session's cookies and localStorage, which are live
#   session credentials, as plaintext JSON in the storage-state volume. Remove them with
#   `docker compose down -v` when you no longer need them (this also deletes the golden
#   browser profile).
#
# Host directories for file uploads are not mounted here. List them in a local
# docker-compose.override.yml (gitignored; copy docker-compose.override.example.yml), which
# Docker Compose merges in automatically. See "File uploads" in SKILL.md.

services:
  # Build-only: the upstream image. The base profile keeps `up` from starting it.
  playwright-base:
    profiles: [base]
    build:
      context: ./mcp-playwright-novnc
      additional_contexts:
        # mcp/playwright:latest as published 2026-06-26. Change it deliberately (see
        # "update" in SKILL.md).
        "mcp/playwright:latest": "docker-image://mcp/playwright@sha256:8771dc4666e7c11440bfc6a0c6b00480e9a15b8891b45f29a52d7d995f8d1492"
    image: mcp-playwright-novnc:base

  playwright-display:
    build:
      # Adds the pinned Chrome for Testing build (see chrome/Dockerfile).
      context: ./chrome
      additional_contexts:
        base: "service:playwright-base"
    image: mcp-playwright-novnc:local
    container_name: playwright-display
    # Start as root to fix volume permissions, then supervisord runs processes as pwuser
    user: root
    # Bind to localhost only: these expose a controllable browser + MCP servers and must
    # not be reachable from the LAN. Claude Code connects via SSE on 127.0.0.1.
    ports:
      - "127.0.0.1:6080:6080"   # noVNC web interface
      - "127.0.0.1:3080:3080"   # MCP SSE endpoint (isolated sessions)
      - "127.0.0.1:3081:3081"   # MCP SSE endpoint (golden session)
    volumes:
      # Workaround: Claude Code sends MCP roots as host paths → EACCES in container.
      # Custom start-mcp.sh adds --output-dir to override.
      - ./start-mcp.sh:/usr/local/bin/start-mcp.sh:ro
      # Golden session: browser launcher + MCP server + export script
      - ./start-golden-browser.sh:/usr/local/bin/start-golden-browser.sh:ro
      - ./start-mcp-golden.sh:/usr/local/bin/start-mcp-golden.sh:ro
      - ./export-storage-state.js:/usr/local/bin/export-storage-state.js:ro
      - golden-profile:/home/pwuser/golden-profile
      # Storage state: shared between golden (writes) and isolated sessions (reads)
      - storage-state:/home/pwuser/state
      # Custom entrypoint + supervisord.conf overlay
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      # Isolated sessions: pinned Chrome binary, background component updates left on
      - ./playwright-config.json:/etc/playwright-config.json:ro
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - MCP_BROWSER=chromium
      - MCP_PORT=3080
      - GOLDEN_MCP_PORT=3081
      - STORAGE_STATE_PATH=/home/pwuser/state/storage-state.json
    shm_size: '2gb'
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - playwright-network

volumes:
  golden-profile:
    name: playwright-golden-profile
  storage-state:
    name: playwright-storage-state

networks:
  playwright-network:
    name: playwright-network
